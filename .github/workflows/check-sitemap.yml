name: Check sitemap

on:
  # Pushes to main are repaired by fix-sitemap.yml, which re-runs this check
  # and fails only if the problem cannot be fixed automatically.
  pull_request:
    paths:
      - 'sitemap.xml'
      - 'scripts/check-sitemap.py'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Every <loc> must be on https://www.wealthsproutkids.com and unique
        run: python3 scripts/check-sitemap.py
